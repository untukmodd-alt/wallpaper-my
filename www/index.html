<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wallpaper My♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e14;
    --card:#181820;
    --card2:#1f1f2a;
    --accent:#ff4d8d;
    --accent2:#34e4b8;
    --text:#f2f2f5;
    --sub:#9797a8;
    --border:#2a2a36;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden;}
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0;}

  /* HEADER */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:18px 16px 10px;
  }
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .brand .heart{color:var(--accent); font-size:22px;}
  .brand h1{font-size:20px; font-weight:800; letter-spacing:-0.02em;}

  .searchbar{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:10px 14px;
  }
  .searchbar input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-size:14px; font-family:'Inter',sans-serif;
  }
  .searchbar input::placeholder{color:var(--sub);}
  .searchbar svg{flex-shrink:0; opacity:0.6;}

  .genres{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px;
    padding-bottom:4px; scrollbar-width:none;
  }
  .genres::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:999px; font-size:13px;
    background:var(--card); border:1px solid var(--border); color:var(--sub);
    cursor:pointer; white-space:nowrap; font-weight:500; transition:all .15s;
  }
  .chip.active{background:var(--accent); color:#1a0510; border-color:var(--accent); font-weight:600;}
  .chip.add{color:var(--accent2); border-color:var(--accent2); border-style:dashed;}

  /* GRID */
  main{padding:14px 12px 100px;}
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .card{
    background:var(--card); border-radius:16px; overflow:hidden;
    position:relative; cursor:pointer; break-inside:avoid;
    border:1px solid var(--border);
  }
  .card img{width:100%; display:block; object-fit:cover; background:var(--card2);}
  .card .badge{
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
    color:#fff; font-size:11px; font-weight:600;
    padding:4px 8px; border-radius:999px;
    display:flex; align-items:center; gap:4px;
  }
  .card .info{padding:9px 10px 11px;}
  .card .title{font-size:13px; font-weight:600; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .meta{font-size:11px; color:var(--sub); margin-top:3px;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--sub);
  }
  .empty h3{color:var(--text); margin-bottom:6px; font-size:16px;}

  /* FAB */
  .fab{
    position:fixed; bottom:22px; right:20px; z-index:30;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#1a0510;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(255,77,141,0.4);
    border:none; cursor:pointer;
  }

  /* MODALS */
  .overlay{
    position:fixed; inset:0; background:rgba(6,6,10,0.88);
    z-index:100; display:none; flex-direction:column;
    backdrop-filter:blur(6px);
  }
  .overlay.show{display:flex;}
  .modal-top{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px; flex-shrink:0;
  }
  .modal-top button.close{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer;
  }
  .modal-title{font-weight:700; font-size:15px;}

  /* Detail view */
  #detailOverlay .detail-body{flex:1; overflow-y:auto; padding:0 16px 20px;}
  #detailOverlay img{width:100%; border-radius:16px; display:block;}
  .detail-meta{margin-top:14px;}
  .detail-meta h2{font-size:19px; margin-bottom:6px;}
  .detail-meta .row{display:flex; gap:14px; font-size:12.5px; color:var(--sub); margin-bottom:4px;}
  .detail-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-weight:600;
    font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--accent); color:#1a0510;}
  .btn-secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}

  /* Upload form */
  #uploadOverlay .form{padding:0 16px 20px; flex:1; overflow-y:auto;}
  .drop{
    border:2px dashed var(--border); border-radius:16px; padding:30px 14px;
    text-align:center; color:var(--sub); font-size:13px; margin-bottom:16px;
    cursor:pointer; position:relative;
  }
  .drop img{max-width:100%; max-height:200px; border-radius:10px; margin-top:10px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px; font-weight:500;}
  .field input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px; background:var(--card2);
    border:1px solid var(--border); color:var(--text); font-size:14px; outline:none;
  }
  .genre-picker{display:flex; flex-wrap:wrap; gap:8px;}

  /* Crop modal */
  #cropOverlay .crop-stage{
    flex:1; position:relative; overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  #cropCanvas{position:absolute; cursor:grab; touch-action:none;}
  .crop-frame{
    position:absolute; border:2px solid var(--accent); pointer-events:none;
    box-shadow:0 0 0 999px rgba(6,6,10,0.7);
  }
  .crop-controls{padding:14px 16px 20px;}
  .crop-controls input[type=range]{width:100%; accent-color:var(--accent);}
  .crop-controls .label{font-size:12px; color:var(--sub); margin-bottom:6px;}

  .hidden-input{display:none;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="heart">♡</span><h1>Wallpaper My</h1></div>
  <div class="searchbar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Cari judul wallpaper...">
    <button onclick="manualRefresh()" style="background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:0 2px;">⟳</button>
  </div>
  <div class="genres" id="genreRow"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <h3>Belum ada wallpaper</h3>
    <div>Tap tombol + di kanan bawah buat upload foto pertama kamu</div>
  </div>
</main>

<button class="fab" onclick="openUpload()">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="detailOverlay">
  <div class="modal-top">
    <span class="modal-title">Detail</span>
    <button class="close" onclick="closeOverlay('detailOverlay')">✕</button>
  </div>
  <div class="detail-body">
    <img id="detailImg" src="">
    <div class="detail-meta">
      <h2 id="detailTitle"></h2>
      <div class="row"><span id="detailGenre"></span></div>
      <div class="row"><span id="detailDate"></span></div>
      <div class="row"><span id="detailViews"></span></div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-secondary" onclick="openCrop()">Crop dulu</button>
      <button class="btn btn-primary" onclick="downloadOriginal()">Unduh Asli</button>
    </div>
    <div class="detail-actions" id="wallpaperActionRow" style="display:none;">
      <button class="btn btn-secondary" style="width:100%;" onclick="setAsWallpaper()">📱 Jadikan Wallpaper</button>
    </div>
  </div>
</div>

<!-- UPLOAD OVERLAY -->
<div class="overlay" id="uploadOverlay">
  <div class="modal-top">
    <span class="modal-title">Upload Wallpaper</span>
    <button class="close" onclick="closeOverlay('uploadOverlay')">✕</button>
  </div>
  <div class="form">
    <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div id="dropText">Tap untuk pilih foto dari galeri</div>
      <img id="previewImg" style="display:none;">
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden-input">

    <div class="field">
      <label>Judul foto</label>
      <input type="text" id="titleInput" placeholder="Contoh: Raiden Shogun Sunset">
    </div>

    <div class="field">
      <label>Genre</label>
      <div class="genre-picker" id="genrePicker"></div>
    </div>

    <button class="btn btn-primary" style="width:100%;" onclick="saveUpload()">Simpan Wallpaper</button>
  </div>
</div>

<!-- GENRE MANAGER OVERLAY -->
<div class="overlay" id="genreManagerOverlay">
  <div class="modal-top">
    <span class="modal-title">Kelola Genre</span>
    <button class="close" onclick="closeOverlay('genreManagerOverlay')">✕</button>
  </div>
  <div class="detail-body" id="genreManagerList"></div>
</div>

<!-- CROP OVERLAY -->
<div class="overlay" id="cropOverlay">
  <div class="modal-top">
    <span class="modal-title">Crop Foto</span>
    <button class="close" onclick="closeOverlay('cropOverlay')">✕</button>
  </div>
  <div class="crop-stage" id="cropStage">
    <canvas id="cropCanvas"></canvas>
    <div class="crop-frame" id="cropFrame"></div>
  </div>
  <div class="crop-controls">
    <div class="label">Zoom</div>
    <input type="range" id="zoomSlider" min="100" max="300" value="100">
    <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="downloadCropped()">Unduh Hasil Crop</button>
  </div>
</div>

<script>
/* ---------- IndexedDB setup ---------- */
let db;
const DB_NAME = 'wallpaperMyDB', STORE = 'photos';
const req = indexedDB.open(DB_NAME, 1);
req.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore(STORE, { keyPath: 'id' });
};
req.onsuccess = e => { db = e.target.result; loadGenres(); renderGrid(); };
req.onerror = e => {
  alert('Penyimpanan tidak bisa diakses di browser ini (' + (e.target.error ? e.target.error.message : 'unknown') + '). Coba buka file ini lewat browser lain, atau upload ke web server/hosting dulu (jangan dibuka langsung sebagai file lokal).');
};

function tx(mode){
  if(!db){ alert('Penyimpanan belum siap, coba lagi sebentar.'); throw new Error('DB not ready'); }
  return db.transaction(STORE, mode).objectStore(STORE);
}

function getAllPhotos(){
  return new Promise(res=>{
    const out=[]; const cur = tx('readonly').openCursor();
    cur.onsuccess = e=>{
      const c = e.target.result;
      if(c){ out.push(c.value); c.continue(); } else res(out);
    };
  });
}

/* ---------- State ---------- */
let genres = JSON.parse(localStorage.getItem('wm_genres') || '["Genshin Impact","Wuthering Waves"]');
let activeGenre = 'Semua';
let searchTerm = '';
let currentDetailId = null;
let uploadFile = null;
let uploadObjectURL = null;

function saveGenresLS(){ localStorage.setItem('wm_genres', JSON.stringify(genres)); }

/* ---------- Genre row ---------- */
function loadGenres(){ renderGenreRow(); renderGenrePicker(); }

function renderGenreRow(){
  const row = document.getElementById('genreRow');
  row.innerHTML = '';
  const all = ['Semua', ...genres];
  all.forEach(g=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (g===activeGenre ? ' active' : '');
    chip.textContent = g;
    chip.onclick = ()=>{ activeGenre = g; renderGenreRow(); renderGrid(); };
    row.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add';
  addChip.textContent = '+ Genre';
  addChip.onclick = addGenrePrompt;
  row.appendChild(addChip);

  const manageChip = document.createElement('div');
  manageChip.className = 'chip';
  manageChip.textContent = '⚙ Kelola';
  manageChip.onclick = openGenreManager;
  row.appendChild(manageChip);
}

function openGenreManager(){
  const wrap = document.getElementById('genreManagerList');
  wrap.innerHTML = '';
  if(genres.length===0){
    wrap.innerHTML = '<div style="color:var(--sub); font-size:13px;">Belum ada genre.</div>';
  }
  genres.forEach(g=>{
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);';
    row.innerHTML = `<span style="font-size:14px;">${escapeHtml(g)}</span>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" style="flex:none; padding:8px 12px; font-size:12px;" onclick="renameGenre('${g.replace(/'/g,"\\'")}')">Ubah</button>
        <button class="btn btn-secondary" style="flex:none; padding:8px 12px; font-size:12px; color:var(--accent);" onclick="deleteGenre('${g.replace(/'/g,"\\'")}')">Hapus</button>
      </div>`;
    wrap.appendChild(row);
  });
  document.getElementById('genreManagerOverlay').classList.add('show');
}

async function renameGenre(oldName){
  const newName = prompt('Nama genre baru untuk "'+oldName+'":', oldName);
  if(!newName || !newName.trim() || newName.trim()===oldName) return;
  const trimmed = newName.trim();
  if(genres.includes(trimmed)){ alert('Nama genre itu sudah ada.'); return; }

  genres = genres.map(g => g===oldName ? trimmed : g);
  saveGenresLS();

  const all = await getAllPhotos();
  const store = tx('readwrite');
  all.filter(p=>p.genre===oldName).forEach(p=>{
    p.genre = trimmed;
    store.put(p);
  });
  if(activeGenre===oldName) activeGenre = trimmed;

  renderGenreRow(); renderGenrePicker(); openGenreManager(); renderGrid();
}

async function deleteGenre(name){
  const all = await getAllPhotos();
  const usedCount = all.filter(p=>p.genre===name).length;
  const msg = usedCount>0
    ? `Genre "${name}" dipakai di ${usedCount} foto. Foto itu akan dipindah ke "Tanpa Genre". Lanjut hapus?`
    : `Hapus genre "${name}"?`;
  if(!confirm(msg)) return;

  genres = genres.filter(g=>g!==name);
  saveGenresLS();

  const store = tx('readwrite');
  all.filter(p=>p.genre===name).forEach(p=>{
    p.genre = 'Tanpa Genre';
    store.put(p);
  });
  if(activeGenre===name) activeGenre = 'Semua';

  renderGenreRow(); renderGenrePicker(); openGenreManager(); renderGrid();
}

function addGenrePrompt(){
  const name = prompt('Nama genre baru:');
  if(name && name.trim() && !genres.includes(name.trim())){
    genres.push(name.trim());
    saveGenresLS();
    renderGenreRow();
    renderGenrePicker();
  }
}

let pickedGenre = null;
function renderGenrePicker(){
  const wrap = document.getElementById('genrePicker');
  wrap.innerHTML = '';
  genres.forEach(g=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (g===pickedGenre ? ' active':'');
    chip.textContent = g;
    chip.onclick = ()=>{ pickedGenre = g; renderGenrePicker(); };
    wrap.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add';
  addChip.textContent = '+ Genre';
  addChip.onclick = addGenrePrompt;
  wrap.appendChild(addChip);
}

/* ---------- Grid ---------- */
async function renderGrid(){
  const all = await getAllPhotos();
  let filtered = all.filter(p=>{
    const matchGenre = activeGenre==='Semua' || p.genre===activeGenre;
    const matchSearch = !searchTerm || p.title.toLowerCase().includes(searchTerm.toLowerCase());
    return matchGenre && matchSearch;
  }).sort((a,b)=>b.dateAdded-a.dateAdded);

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  if(filtered.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';

  filtered.forEach(p=>{
    const url = URL.createObjectURL(p.blob);
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = ()=>openDetail(p.id);
    card.innerHTML = `
      <img src="${url}" loading="lazy">
      <div class="badge">👁 ${p.views}</div>
      <div class="info">
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="meta">${p.genre} · ${formatDate(p.dateAdded)}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
}

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value; renderGrid();
});

/* ---------- Detail ---------- */
async function openDetail(id){
  const all = await getAllPhotos();
  const p = all.find(x=>x.id===id);
  if(!p) return;
  currentDetailId = id;

  p.views = (p.views||0) + 1;
  tx('readwrite').put(p);

  document.getElementById('detailImg').src = URL.createObjectURL(p.blob);
  document.getElementById('detailTitle').textContent = p.title;
  document.getElementById('detailGenre').textContent = 'Genre: ' + p.genre;
  document.getElementById('detailDate').textContent = 'Ditambahkan: ' + formatDate(p.dateAdded);
  document.getElementById('detailViews').textContent = 'Dilihat: ' + p.views + ' kali';
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('wallpaperActionRow').style.display = isNativeApp() ? 'flex' : 'none';
  renderGrid();
}

function downloadOriginal(){
  getAllPhotos().then(all=>{
    const p = all.find(x=>x.id===currentDetailId);
    if(!p) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(p.blob);
    a.download = (p.title || 'wallpaper').replace(/\s+/g,'_') + '.' + (p.blob.type.split('/')[1] || 'jpg');
    a.click();
  });
}

function closeOverlay(id){
  document.getElementById(id).classList.remove('show');
}

/* ---------- Upload ---------- */
function openUpload(){
  uploadFile = null;
  document.getElementById('titleInput').value = '';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('dropText').style.display = 'block';
  pickedGenre = genres[0] || null;
  renderGenrePicker();
  document.getElementById('uploadOverlay').classList.add('show');
}

document.getElementById('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  uploadFile = file;
  if(uploadObjectURL) URL.revokeObjectURL(uploadObjectURL);
  uploadObjectURL = URL.createObjectURL(file);
  const img = document.getElementById('previewImg');
  img.src = uploadObjectURL;
  img.style.display = 'block';
  document.getElementById('dropText').style.display = 'none';
});

function saveUpload(){
  const title = document.getElementById('titleInput').value.trim();
  if(!uploadFile){ alert('Pilih foto dulu ya'); return; }
  if(!title){ alert('Isi judul foto dulu ya'); return; }
  if(!pickedGenre){ alert('Pilih genre dulu ya'); return; }

  const record = {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    title, genre: pickedGenre,
    blob: uploadFile,
    views: 0,
    dateAdded: Date.now()
  };

  const request = tx('readwrite').add(record);
  request.onsuccess = ()=>{
    closeOverlay('uploadOverlay');
    activeGenre = 'Semua';
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    renderGenreRow();
    getAllPhotos().then(all=>{
      renderGrid();
      console.log('Total foto tersimpan:', all.length);
    });
  };
  request.onerror = (e)=>{
    alert('Gagal menyimpan foto: ' + (e.target.error ? e.target.error.message : 'unknown error'));
  };
}

function manualRefresh(){
  renderGrid();
}

/* ---------- Crop ---------- */
let cropImg = new Image();
let cropState = { scale:1, minScale:1, offX:0, offY:0, frame:0 };
let dragging = false, lastX=0, lastY=0;

function openCrop(){
  getAllPhotos().then(all=>{
    const p = all.find(x=>x.id===currentDetailId);
    if(!p) return;
    const url = URL.createObjectURL(p.blob);
    cropImg = new Image();
    cropImg.onload = ()=>{
      setupCropCanvas();
    };
    cropImg.src = url;
    document.getElementById('cropOverlay').classList.add('show');
  });
}

function setupCropCanvas(){
  const stage = document.getElementById('cropStage');
  const canvas = document.getElementById('cropCanvas');
  const frame = document.getElementById('cropFrame');
  const ctx = canvas.getContext('2d');

  const stageW = stage.clientWidth, stageH = stage.clientHeight;
  const frameSize = Math.min(stageW, stageH) * 0.82;
  frame.style.width = frameSize + 'px';
  frame.style.height = frameSize + 'px';
  frame.style.left = (stageW-frameSize)/2 + 'px';
  frame.style.top = (stageH-frameSize)/2 + 'px';
  cropState.frame = frameSize;

  const minScale = frameSize / Math.min(cropImg.width, cropImg.height);
  cropState.minScale = minScale;
  cropState.scale = minScale;
  cropState.offX = (stageW - cropImg.width*minScale)/2;
  cropState.offY = (stageH - cropImg.height*minScale)/2;

  canvas.width = stageW; canvas.height = stageH;
  canvas.style.width = stageW+'px'; canvas.style.height = stageH+'px';

  document.getElementById('zoomSlider').value = 100;

  function draw(){
    ctx.clearRect(0,0,stageW,stageH);
    ctx.drawImage(cropImg, cropState.offX, cropState.offY,
      cropImg.width*cropState.scale, cropImg.height*cropState.scale);
  }
  cropState.draw = draw;
  draw();

  canvas.onpointerdown = e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = e=>{
    if(!dragging) return;
    cropState.offX += (e.clientX - lastX);
    cropState.offY += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    draw();
  };
  canvas.onpointerup = ()=>{ dragging=false; };

  document.getElementById('zoomSlider').oninput = e=>{
    const pct = e.target.value/100;
    const newScale = cropState.minScale * pct;
    const cx = stageW/2, cy = stageH/2;
    const ratio = newScale / cropState.scale;
    cropState.offX = cx - (cx - cropState.offX)*ratio;
    cropState.offY = cy - (cy - cropState.offY)*ratio;
    cropState.scale = newScale;
    draw();
  };
}

function downloadCropped(){
  const stage = document.getElementById('cropStage');
  const frame = document.getElementById('cropFrame');
  const frameRect = frame.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();

  const fx = frameRect.left - stageRect.left;
  const fy = frameRect.top - stageRect.top;
  const fsize = cropState.frame;

  // map frame area (in stage coords) back to original image pixel coords
  const srcX = (fx - cropState.offX) / cropState.scale;
  const srcY = (fy - cropState.offY) / cropState.scale;
  const srcSize = fsize / cropState.scale;

  const outSize = Math.round(srcSize); // keep native resolution, no downscale
  const out = document.createElement('canvas');
  out.width = outSize; out.height = outSize;
  const octx = out.getContext('2d');
  octx.drawImage(cropImg, srcX, srcY, srcSize, srcSize, 0, 0, outSize, outSize);

  out.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wallpaper_crop.png';
    a.click();
  }, 'image/png', 1.0);
}

/* ==================================================================
   CAPACITOR NATIVE INTEGRATION (share intent + set wallpaper)
   Fungsi-fungsi ini cuma aktif kalau dijalankan sebagai APK asli
   (bukan dibuka lewat browser biasa) — window.Capacitor cuma ada
   di dalam shell native.
   ================================================================== */

function isNativeApp(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
}

/* --- Terima foto lewat Share Intent dari app lain (Galeri, dll) --- */
function initShareIntentListener(){
  if(!isNativeApp()) return;
  const plugins = window.Capacitor.Plugins || {};
  const ShareTarget = plugins.CapacitorShareTarget;
  if(!ShareTarget) return;

  ShareTarget.addListener('shareReceived', async (event)=>{
    if(!event.files || event.files.length===0) return;
    const sharedFile = event.files[0]; // { path/uri, mimeType, ... }
    try{
      // path yang dikasih plugin biasanya berupa content:// URI,
      // Capacitor.convertFileSrc bikin itu bisa diakses via fetch()
      const src = window.Capacitor.convertFileSrc(sharedFile.path || sharedFile.uri);
      const res = await fetch(src);
      const blob = await res.blob();
      const file = new File([blob], 'shared_photo.jpg', { type: blob.type || 'image/jpeg' });

      // langsung buka form upload dengan foto yang di-share sudah terisi
      openUpload();
      uploadFile = file;
      const previewUrl = URL.createObjectURL(file);
      const img = document.getElementById('previewImg');
      img.src = previewUrl;
      img.style.display = 'block';
      document.getElementById('dropText').style.display = 'none';
    }catch(err){
      alert('Gagal membaca foto yang di-share: ' + err.message);
    }
  });
}

/* --- Set foto yang lagi dibuka jadi wallpaper HP --- */
async function setAsWallpaper(){
  if(!isNativeApp()){
    alert('Fitur set wallpaper cuma bisa dipakai di versi APK, bukan di browser.');
    return;
  }
  const plugins = window.Capacitor.Plugins || {};
  const Wallpaper = plugins.Wallpaper;
  if(!Wallpaper){
    alert('Plugin wallpaper belum aktif.');
    return;
  }
  try{
    const all = await getAllPhotos();
    const p = all.find(x=>x.id===currentDetailId);
    if(!p) return;
    const base64 = await blobToBase64(p.blob);
    await Wallpaper.setBase64({ base64: base64.split(',')[1], data: '' });
    alert('Wallpaper berhasil dipasang!');
  }catch(err){
    alert('Gagal set wallpaper: ' + err.message);
  }
}

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Jalankan listener share intent begitu app dibuka
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(initShareIntentListener, 300);
});
